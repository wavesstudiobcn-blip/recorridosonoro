<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Recorrido sonoro · FW26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bk:#000000; --wh:#FFFFFF; --grey:#8a8a8a; --line:#222;
    --accent:#FFFFFF; --on:#000000;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bk);color:var(--wh)}
  body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{color:inherit}
  .display{font-family:'Archivo Black','Inter',sans-serif;letter-spacing:-.045em;line-height:.88;text-transform:uppercase}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 56px}

  /* top bar */
  .bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding-bottom:20px;border-bottom:1px solid var(--line)}
  .brand{font-size:15px;letter-spacing:.32em}
  .brand img{height:18px;width:auto;display:block}

  /* cover */
  .cover{position:relative;height:100vh;height:100svh;min-height:520px;overflow:hidden;background:#000}
  .cover img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;transform:scale(1.06);animation:settle 2.4s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes settle{to{transform:scale(1)}}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 62%,rgba(0,0,0,.85) 100%)}
  .cover .logo{position:absolute;z-index:2;top:calc(28px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(46vw,240px);height:auto}
  .cover .title{position:absolute;z-index:2;left:16px;right:16px;bottom:calc(64px + env(safe-area-inset-bottom));font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(34px,10vw,72px);letter-spacing:-.02em;line-height:1;color:#fff}
  .cover .cue{position:absolute;z-index:2;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#fff}
  .cover .cue span:last-child{animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(4px)}}
  /* vertical: la foto se ve entera (las dos sillas) y la pared roja continúa hacia arriba */
  @media (max-aspect-ratio:1/1){
    .cover{background:#54110a}
    .cover img.bg{inset:auto auto 0 50%;width:190vw;height:auto;object-fit:initial;transform:translateX(-50%) scale(1.04);animation:settleV 2.4s cubic-bezier(.2,.7,.2,1) forwards;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%);mask-image:linear-gradient(180deg,transparent 0,#000 18%)}
    @keyframes settleV{to{transform:translateX(-50%) scale(1)}}
    .cover::after{background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 72%,rgba(0,0,0,.7) 100%)}
    .cover .logo{top:calc(48px + env(safe-area-inset-top));width:min(58vw,260px)}
  }
  @media (min-width:900px){.cover .title{left:48px;bottom:84px}.cover .cue{left:48px;right:48px}}

  /* home */
  .hero{padding:40px 0 8px}
  .kicker{display:block;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--grey)}
  .hello{font-size:clamp(46px,14vw,84px);margin:14px 0 24px}
  .hero h1{font-size:clamp(52px,16vw,96px)}
  .hero p+p{margin-top:16px}
  .hero p{margin-top:0;font-size:17px;line-height:1.5;color:#d6d6d6;max-width:440px}
  .count{display:flex;align-items:baseline;gap:10px;margin:28px 0 14px}
  .count b{font-family:'Archivo Black';font-size:44px;letter-spacing:-.04em}
  .count span{color:var(--grey);font-size:14px}
  .meter-unused{height:4px;background:var(--line);overflow:hidden}
  .meter i{display:block;height:100%;background:var(--wh);transition:width .6s}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:28px}
  .tile{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1px solid var(--line);color:#444;text-decoration:none}
  .tile.on{border-color:transparent}
  .sec{margin-top:36px}
  .sec-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--line);font-family:'Archivo Black','Inter',sans-serif;font-size:28px;letter-spacing:-.03em;text-transform:uppercase}
  .sec-h span:last-child{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--grey);letter-spacing:0}
  .sec .grid{margin-top:14px}
  .palette{margin-top:56px;padding-top:40px;border-top:1px solid var(--line)}
  .palette h2{font-size:clamp(56px,17vw,96px);text-transform:none;letter-spacing:-.05em;margin:12px 0 22px}
  .palette p{font-size:16px;line-height:1.55;color:#d6d6d6}
  .swatches{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
  .swatch{height:48px;display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:700;letter-spacing:-.01em;opacity:0;transform:translateY(8px);animation:up .5s ease forwards}
  @media (min-width:480px){.swatch{font-size:14px;padding:0 16px}}
  .closing{margin-top:72px;padding-top:40px;border-top:1px solid var(--line)}
  .closing h2{font-size:clamp(46px,14vw,84px);margin:14px 0 24px}
  .closing p{font-size:16px;line-height:1.55;color:#d6d6d6}
  .closing p+p{margin-top:14px}
  .closing .stars{margin-top:28px}
  .sig{margin-top:40px;display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--grey)}
  .empty{margin-top:14px;font-size:14px;color:#555}
  .counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .qr-sec{font-family:'Archivo Black',sans-serif;font-size:32px;text-transform:uppercase;letter-spacing:-.03em;margin-top:32px}
  .qr-name{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  @media print{.qr-sec{color:#000;break-before:page}.qr-sec:first-child{break-before:auto}}
  .legend{margin-top:16px;font-size:12px;color:var(--grey);line-height:1.5}

  /* track */
  .track{padding-top:36px}
  .tag{display:inline-block;padding:7px 12px;font-size:13px;font-weight:700;background:var(--accent);color:var(--on)}
  .num{font-size:clamp(150px,52vw,280px);color:var(--accent);margin-top:18px}
  .of{font-family:'Archivo Black';font-size:22px;color:var(--grey);margin-top:6px;letter-spacing:-.02em}
  .ttl{font-size:20px;font-weight:600;margin-top:22px}
  .player{margin-top:36px;display:flex;align-items:center;gap:18px}
  .play{width:76px;height:76px;flex:0 0 76px;border-radius:50%;background:var(--wh);color:var(--bk);display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .play:active{transform:scale(.94)}
  .play svg{width:28px;height:28px}
  .prog{flex:1}
  .rail{height:4px;background:var(--line);position:relative;cursor:pointer}
  .rail i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent)}
  .times{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--grey);font-variant-numeric:tabular-nums}
  .note{margin-top:22px;font-size:13px;color:var(--grey);line-height:1.5}
  .note button{text-decoration:underline;color:var(--wh)}

  /* review */
  .review{margin-top:48px;padding-top:32px;border-top:1px solid var(--line);display:none;animation:up .5s ease}
  .review.show{display:block}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .review h2{font-size:clamp(40px,12vw,64px)}
  .review p.sub{margin-top:12px;color:#d6d6d6;font-size:15px}
  .stars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:24px}
  .stars button{height:56px;border:1px solid #333;font-family:'Archivo Black';font-size:20px;transition:background .15s,color .15s}
  .stars button.sel{background:var(--accent);color:var(--on);border-color:transparent}
  textarea{width:100%;margin-top:14px;min-height:120px;background:var(--bk);color:var(--wh);border:1px solid #333;padding:14px;font:inherit;font-size:16px;resize:vertical}
  textarea:focus{outline:none;border-color:var(--wh)}
  .cta{width:100%;margin-top:14px;padding:18px;background:var(--wh);color:var(--bk);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
  .cta:disabled{opacity:.3;cursor:default}
  .ghost{display:block;text-align:center;margin-top:18px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;text-decoration:none;color:var(--grey)}
  .thanks h2{font-size:clamp(48px,14vw,80px);color:var(--accent)}

  /* admin */
  .admin h1{font-size:48px;margin:36px 0 8px}
  .admin label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);margin-top:20px}
  .admin input{width:100%;margin-top:8px;padding:12px;background:var(--bk);border:1px solid #333;color:var(--wh);font:inherit}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{padding:12px 16px;border:1px solid var(--wh);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .btn.fill{background:var(--wh);color:var(--bk)}
  .qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:24px}
  .qr{background:var(--wh);color:var(--bk);padding:12px;text-align:center}
  .qr .code{display:flex;justify-content:center}
  .qr .code img,.qr .code canvas{width:100%!important;height:auto!important}
  .qr b{display:block;font-family:'Archivo Black';font-size:22px;margin-top:8px}
  .qr small{font-size:9px;word-break:break-all;color:#555}
  .qr .sw{height:6px;margin-top:8px}
  table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
  td,th{border-bottom:1px solid var(--line);padding:10px 6px;text-align:left;vertical-align:top}
  th{color:var(--grey);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .wide{max-width:1100px}

  @media print{
    body{background:#fff}
    .noprint{display:none!important}
    .wrap{max-width:none;padding:0}
    .qrs{grid-template-columns:repeat(4,1fr);gap:0}
    .qr{border:1px dashed #ccc;break-inside:avoid;padding:18px}
  }
</style>
</head>

const PALETTE = [
  {name:"#ChocolateBrown",      hex:"#5E3F38", on:"#FFFFFF"},
  {name:"#ForestGreen",         hex:"#545000", on:"#FFFFFF"},
  {name:"#Berry&Burgundy",      hex:"#660000", on:"#FFFFFF"},
  {name:"#WarmNeutrals",        hex:"#CFBDB9", on:"#000000"},
  {name:"#DustyBlue",           hex:"#C3DAF0", on:"#000000"},
  {name:"#Butter&SunnyYellow",  hex:"#FDF8B0", on:"#000000"},
  {name:"#DeepRed",             hex:"#960000", on:"#FFFFFF"},
  {name:"#SoftLilac&PowderPink",hex:"#F1CFEC", on:"#000000"}
];
const colorFor = n => PALETTE[(n-1) % PALETTE.length];

/* ---------- utilidades ---------- */
function pad(n){return String(n).padStart(2,"0")}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const key = (sec,n) => `${sec}-${n}`;
const heard = () => store.get("fw26_heard_v2",[]);
const markHeard = k => {const h=heard(); if(!h.includes(k)){h.push(k);store.set("fw26_heard_v2",h)}};
const heardIn = sec => heard().filter(k=>k.startsWith(sec+"-")).map(k=>+k.split("-")[1]).sort((a,b)=>a-b);
const secById = id => CONFIG.sections.find(x=>x.id===id);
const fmt = s => isFinite(s)?`${Math.floor(s/60)}:${pad(Math.floor(s%60))}`:"0:00";
const brand = () => CONFIG.logo ? `<span class="brand"><img src="${CONFIG.logo}" alt="ZARA"></span>` : `<span class="brand">ZARA</span>`;
const baseUrl = () => location.origin + location.pathname;

/* ---------- router ---------- */
const q = new URLSearchParams(location.search);
const sec = secById(q.get("s")), p = parseInt(q.get("p"),10);
if (q.has("admin")) renderAdmin();
else if (sec && p>=1) renderTrack(sec,p);
else renderHome();

/* ---------- HOME ---------- */
function renderHome(){
  const total = heard().length;
  let blocks = "";
  for(const s of CONFIG.sections){
    const list = heardIn(s.id);
    const tiles = list.map(i=>{const c=colorFor(i);return `<a class="tile on" href="?s=${s.id}&p=${i}" style="background:${c.hex};color:${c.on}">${pad(i)}</a>`}).join("");
    blocks += `<div class="sec"><div class="sec-h"><span>${esc(s.name)}</span><span>${list.length} escuchado${list.length===1?"":"s"}</span></div>
      ${list.length ? `<div class="grid">${tiles}</div>` : `<p class="empty">Escanea tu primer QR de ${esc(s.name)}.</p>`}</div>`;
  }
  $("#app").innerHTML = `
  <section class="cover">
    <img class="bg" src="${CONFIG.cover}" alt="">
    <img class="logo" src="${CONFIG.logo}" alt="ZARA">
    <h1 class="title">Recorrido<br>sonoro</h1>
    <div class="cue"><span>FALL/WINTER26</span><span>Desliza ↓</span></div>
  </section>
  <div class="wrap">
    <section class="hero">
      <span class="kicker">The Trend Talk · Pelayo 30</span>
      <h2 class="display hello">¡Hola,<br>Pelayero!</h2>
      <p>Esta semana la tienda se convierte en un recorrido sonoro. Hemos repartido códigos QR por la planta y cada uno esconde una pieza de audio sobre FW26.</p>
      <p>El recorrido está dividido en tres secciones: <b>Mujer</b>, <b>Hombre</b> y <b>Niño</b>. En cada una descubrirás los colores de la temporada, las historias detrás de cada tendencia y cómo llevar la inspiración de la pasarela a nuestras conversaciones en tienda.</p>
      <p>Escanea, escucha hasta el final y deja tu reseña. Tu opinión nos ayuda a vivir la temporada juntos.</p>
    </section>
    <section class="palette">
      <span class="kicker">La paleta de la temporada</span>
      <h2 class="display">Colours</h2>
      <p>Naturaleza, calidez y atemporalidad. FW26 deja atrás los colores excesivamente vibrantes y apuesta por tonos orgánicos y neutros con pequeños acentos de color. Sin una paleta rígida para cada armario: las fronteras cromáticas se suavizan para crear un universo más contemporáneo y menos estereotipado.</p>
      <div class="swatches">
        ${PALETTE.map((c,i)=>`<div class="swatch" style="background:${c.hex};color:${c.on};animation-delay:${i*60}ms">${esc(c.name)}</div>`).join("")}
      </div>
      <p style="margin-top:20px;font-size:13px;color:var(--grey)">Cada audio del recorrido lleva uno de estos colores.</p>
    </section>

    <section class="palette" style="margin-top:56px">
      <span class="kicker">Tu recorrido</span>
    </section>
    <div class="count"><b>${pad(total)}</b><span>piezas escuchadas</span></div>
    ${blocks}
    <p class="legend">Cada pieza que escuchas aparece aquí con su color de temporada. Tócala para volver a escucharla.</p>

    <section class="closing" id="closing">
      <span class="kicker">Cierre</span>
      <h2 class="display">Gracias,<br>Pelayero</h2>
      <p>Hasta aquí The Trend Talk FW26. Esperamos que cada audio te haya dado nuevas ideas para hablar de la temporada con nuestros clientes y para vivir la colección desde dentro.</p>
      <p>Antes de irte, cuéntanos qué te ha parecido la experiencia. Tu reseña nos ayuda a preparar las próximas.</p>
      <div id="finalForm">
        <div class="stars" id="fstars">
          ${[1,2,3,4,5].map(v=>`<button data-v="${v}" aria-label="${v} de 5">${v}</button>`).join("")}
        </div>
        <textarea id="ftxt" maxlength="800" placeholder="¿Qué te ha gustado? ¿Qué mejorarías?"></textarea>
        <button class="cta" id="fsend" disabled>Enviar reseña final</button>
      </div>
      <div class="sig"><span>ZARA · Pelayo 30</span><span>FW26</span></div>
    </section>
  </div>`;

  if (store.get("fw26_final_done",false)) $("#finalForm").innerHTML = `<p style="margin-top:24px;color:#fff;font-weight:600">Ya hemos recibido tu reseña final. ¡Gracias!</p>`;
  else {
    let fr = 0;
    $("#fstars").onclick = e => {
      const b = e.target.closest("button"); if(!b) return;
      fr = +b.dataset.v;
      [...$("#fstars").children].forEach(x=>x.classList.toggle("sel", +x.dataset.v <= fr));
      $("#fsend").disabled = false;
    };
    $("#fsend").onclick = async () => {
      const review = {seccion:"Experiencia completa", pieza:0, valoracion:fr, texto:$("#ftxt").value.trim(), fecha:new Date().toISOString()};
      const all = store.get("fw26_reviews",[]); all.push(review); store.set("fw26_reviews",all);
      store.set("fw26_final_done",true);
      if (CONFIG.reviewEndpoint){ try{ await fetch(CONFIG.reviewEndpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(review)}) }catch(e){} }
      $("#finalForm").innerHTML = `<h2 class="display" style="font-size:clamp(40px,12vw,64px);margin-top:28px">¡Gracias!</h2><p style="margin-top:12px">Tu reseña se ha enviado. Nos vemos en el próximo episodio de The Trend Talk.</p>`;
    };
  }
}

/* ---------- TRACK ---------- */
function renderTrack(s, n){
  const c = colorFor(n), k = key(s.id,n);
  document.documentElement.style.setProperty("--accent", c.hex);
  document.documentElement.style.setProperty("--on", c.on);
  const title = CONFIG.titles[k] || `Pieza ${pad(n)}`;
  const src = CONFIG.audio(s.id,n);
  const playIco = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>`;
  const pauseIco = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>`;

  $("#app").innerHTML = `
  <div class="wrap">
    <div class="bar">${brand()}<span>FW26 · ${esc(s.name)}</span></div>
    <section class="track">
      <span class="tag">${esc(c.name)}</span>
      <div class="num display">${pad(n)}</div>
      <div class="of">${esc(s.name)}</div>
      <div class="ttl">${esc(title)}</div>

      <div class="player">
        <button class="play" id="play" aria-label="Reproducir">${playIco}</button>
        <div class="prog">
          <div class="rail" id="rail"><i id="fill"></i></div>
          <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        </div>
      </div>
      <p class="note" id="note">Escucha la pieza completa para dejar tu reseña.</p>

      <section class="review" id="review">
        <span class="kicker">Fin de la pieza ${pad(n)}</span>
        <h2 class="display" style="margin-top:12px">Tu<br>reseña</h2>
        <p class="sub">Has llegado al final de este audio de ${esc(s.name)}. ¿Qué te ha transmitido? Déjanos tu valoración y sigue buscando el siguiente QR.</p>
        <div class="stars" id="stars">
          ${[1,2,3,4,5].map(v=>`<button data-v="${v}" aria-label="${v} de 5">${v}</button>`).join("")}
        </div>
        <textarea id="txt" maxlength="500" placeholder="Escribe aquí (opcional)"></textarea>
        <button class="cta" id="send" disabled>Enviar reseña</button>
      </section>

      <a class="ghost" href="${baseUrl()}">Ver mi recorrido →</a>
    </section>
  </div>`;

  const audio = new Audio(src);
  audio.preload = "metadata";
  const btn = $("#play"), fill = $("#fill");
  btn.onclick = () => audio.paused ? audio.play().catch(()=>{}) : audio.pause();
  audio.onplay  = () => btn.innerHTML = pauseIco;
  audio.onpause = () => btn.innerHTML = playIco;
  audio.onloadedmetadata = () => $("#dur").textContent = fmt(audio.duration);
  audio.ontimeupdate = () => {
    $("#cur").textContent = fmt(audio.currentTime);
    fill.style.width = (audio.currentTime/audio.duration*100||0) + "%";
  };
  $("#rail").onclick = e => {
    if(!audio.duration) return;
    const r = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX-r.left)/r.width) * audio.duration;
  };
  audio.onended = finish;
  audio.onerror = () => {
    $("#note").innerHTML = `Audio no encontrado (<code>${esc(src)}</code>). <button id="sim">Simular final</button>`;
    $("#sim").onclick = finish;
  };

  function finish(){
    markHeard(k);
    fill.style.width = "100%";
    $("#note").textContent = "Pieza completada.";
    const r = $("#review"); r.classList.add("show");
    setTimeout(()=>r.scrollIntoView({behavior:"smooth",block:"start"}),100);
  }

  let rating = 0;
  $("#stars").onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    rating = +b.dataset.v;
    [...$("#stars").children].forEach(x=>x.classList.toggle("sel", +x.dataset.v <= rating));
    $("#send").disabled = false;
  };
  $("#send").onclick = async () => {
    const review = {seccion:s.name, pieza:n, valoracion:rating, texto:$("#txt").value.trim(), fecha:new Date().toISOString()};
    const all = store.get("fw26_reviews",[]); all.push(review); store.set("fw26_reviews",all);
    if (CONFIG.reviewEndpoint){
      try{ await fetch(CONFIG.reviewEndpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(review)}) }catch(e){}
    }
    $("#review").innerHTML = `
      <div class="thanks">
        <h2 class="display">Gracias</h2>
        <p class="sub">Tu reseña se ha enviado. Sigue buscando QR por la tienda.</p>
      </div>`;
  };
}

/* ---------- ADMIN (?admin) ---------- */
function renderAdmin(){
  const reviews = store.get("fw26_reviews",[]);
  const saved = store.get("fw26_counts",{});
  $("#app").innerHTML = `
  <div class="wrap wide admin">
    <div class="bar noprint">${brand()}<span>Panel · FW26</span></div>
    <div class="noprint">
      <h1 class="display">QR</h1>
      <label>URL pública de la web</label>
      <input id="base" value="${esc(baseUrl())}">
      <div class="counts">
        ${CONFIG.sections.map(s=>`<label>${esc(s.name)} · nº de QR<input type="number" min="0" max="200" data-sec="${s.id}" value="${saved[s.id] ?? 0}"></label>`).join("")}
      </div>
      <div class="row">
        <button class="btn fill" id="gen">Generar QR</button>
        <button class="btn" onclick="window.print()">Imprimir</button>
      </div>
    </div>
    <div id="qrs"></div>

    <div class="noprint">
      <h1 class="display">Reseñas</h1>
      <p style="color:var(--grey);font-size:13px">${reviews.length} guardadas en este dispositivo.</p>
      <div class="row">
        <button class="btn" id="csv">Exportar CSV</button>
        <button class="btn" id="clr">Borrar progreso local</button>
      </div>
      <table><thead><tr><th>Sección</th><th>Pieza</th><th>Nota</th><th>Texto</th><th>Fecha</th></tr></thead><tbody>
        ${reviews.map(r=>`<tr><td>${esc(r.seccion||"")}</td><td>${r.pieza?pad(r.pieza):"—"}</td><td>${r.valoracion}/5</td><td>${esc(r.texto)}</td><td>${new Date(r.fecha).toLocaleString("es-ES")}</td></tr>`).join("") || `<tr><td colspan="5" style="color:var(--grey)">Aún no hay reseñas.</td></tr>`}
      </tbody></table>
    </div>
  </div>`;

  const gen = () => {
    const base = $("#base").value.trim().split("?")[0];
    const box = $("#qrs"); box.innerHTML = "";
    const counts = {};
    document.querySelectorAll("[data-sec]").forEach(i=>counts[i.dataset.sec]=Math.max(0,parseInt(i.value,10)||0));
    store.set("fw26_counts",counts);
    for(const s of CONFIG.sections){
      if(!counts[s.id]) continue;
      const h = document.createElement("h2"); h.className="qr-sec"; h.textContent = s.name; box.appendChild(h);
      const grid = document.createElement("div"); grid.className="qrs"; box.appendChild(grid);
      for(let i=1;i<=counts[s.id];i++){
        const url = `${base}?s=${s.id}&p=${i}`, c = colorFor(i);
        const card = document.createElement("div"); card.className="qr";
        card.innerHTML = `<div class="code"></div><b>${pad(i)}</b><div class="qr-name">${esc(s.name)}</div><small>${esc(url)}</small><div class="sw" style="background:${c.hex}"></div>`;
        grid.appendChild(card);
        if (window.QRCode) new QRCode(card.querySelector(".code"),{text:url,width:256,height:256,colorDark:"#000000",colorLight:"#FFFFFF",correctLevel:QRCode.CorrectLevel.M});
        else card.querySelector(".code").textContent = "Sin conexión al generador";
      }
    }
  };
  $("#gen").onclick = gen; gen();

  $("#csv").onclick = () => {
    const rows = [["seccion","pieza","valoracion","texto","fecha"], ...reviews.map(r=>[r.seccion||"",r.pieza,r.valoracion,`"${(r.texto||"").replace(/"/g,'""')}"`,r.fecha])];
    const blob = new Blob(["﻿"+rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "resenas-fw26.csv"; a.click();
  };
  $("#clr").onclick = () => { if(confirm("¿Borrar reseñas y progreso guardados en este dispositivo?")){ try{["fw26_reviews","fw26_heard_v2"].forEach(k=>localStorage.removeItem(k))}catch(e){} location.reload(); } };
}
</script>
</body>
</html>
